name: tools
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'کدام ابزار؟'
        required: true
        default: test
        type: choice
        options: [test, selftest, probe, backtest]
      seconds:
        description: 'فقط برای probe: مدت نمونه‌برداری (ثانیه)'
        default: '240'
jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        run: python -u bot.py ${{ inputs.mode }} ${{ inputs.seconds }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
