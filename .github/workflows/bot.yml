name: alarm-bot
on:
  schedule:            # UTC — هر چهار تایم؛ job خودش تشخیص می‌دهد مسئول امروز هست یا نه
    - cron: '0 10 * * 1-5'    # تابستان: ۰۶:۰۰ نیویورک
    - cron: '0 11 * * 1-5'    # زمستان: ۰۶:۰۰ نیویورک
    - cron: '30 12 * * 1-5'   # پشتیبان ۱
    - cron: '30 13 * * 1-5'   # پشتیبان ۲
  workflow_dispatch:
concurrency:
  group: alarm-bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: run bot
        run: python -u bot.py run
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
